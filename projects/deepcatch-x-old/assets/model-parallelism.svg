<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" style="background:#1e1e1e">
  <style>
    .box { fill: none; stroke: #888; stroke-width: 1.5; }
    .box-fill { fill: #2d2d2d; stroke: #888; stroke-width: 1.5; }
    .box-gpu0 { fill: #3d4a3d; stroke: #6a9; stroke-width: 2; }
    .box-gpu1 { fill: #3d3d4a; stroke: #88a; stroke-width: 2; }
    .box-gpu2 { fill: #4a3d3d; stroke: #a86; stroke-width: 2; }
    .box-gpu3 { fill: #4a3d4a; stroke: #a8a; stroke-width: 2; }
    .text { font-family: 'Courier New', monospace; fill: #ccc; font-size: 12px; }
    .text-title { font-family: 'Courier New', monospace; fill: #ccc; font-size: 14px; font-weight: bold; }
    .text-small { font-family: 'Courier New', monospace; fill: #888; font-size: 10px; }
    .line { stroke: #888; stroke-width: 1.5; fill: none; }
    .line-dash { stroke: #888; stroke-width: 1.5; stroke-dasharray: 5,3; fill: none; }
    .arrow { fill: #888; }
  </style>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" class="text-title">Hybrid Model Parallelism: Pipeline + Tensor Parallel</text>

  <!-- Pipeline Parallel Label -->
  <text x="80" y="55" text-anchor="middle" class="text">Pipeline Parallel</text>
  <text x="80" y="70" text-anchor="middle" class="text-small">(Layer Split)</text>

  <!-- Stage boxes -->
  <rect x="150" y="50" width="120" height="80" rx="3" class="box-gpu0"/>
  <text x="210" y="75" text-anchor="middle" class="text">Stage 0</text>
  <text x="210" y="92" text-anchor="middle" class="text-small">Layers 0-5</text>
  <text x="210" y="108" text-anchor="middle" class="text-small">GPU 0</text>
  <text x="210" y="122" text-anchor="middle" class="text-small">GPU 1</text>

  <line x1="270" y1="90" x2="300" y2="90" class="line"/>
  <polygon points="310,90 300,85 300,95" class="arrow"/>

  <rect x="310" y="50" width="120" height="80" rx="3" class="box-gpu1"/>
  <text x="370" y="75" text-anchor="middle" class="text">Stage 1</text>
  <text x="370" y="92" text-anchor="middle" class="text-small">Layers 6-11</text>
  <text x="370" y="108" text-anchor="middle" class="text-small">GPU 2</text>
  <text x="370" y="122" text-anchor="middle" class="text-small">GPU 3</text>

  <line x1="430" y1="90" x2="460" y2="90" class="line"/>
  <polygon points="470,90 460,85 460,95" class="arrow"/>

  <rect x="470" y="50" width="120" height="80" rx="3" class="box-gpu2"/>
  <text x="530" y="75" text-anchor="middle" class="text">Stage 2</text>
  <text x="530" y="92" text-anchor="middle" class="text-small">Layers 12-17</text>
  <text x="530" y="108" text-anchor="middle" class="text-small">GPU 4</text>
  <text x="530" y="122" text-anchor="middle" class="text-small">GPU 5</text>

  <!-- Tensor Parallel Detail -->
  <text x="80" y="170" text-anchor="middle" class="text">Tensor Parallel</text>
  <text x="80" y="185" text-anchor="middle" class="text-small">(Head Split)</text>

  <!-- Detailed tensor parallel view -->
  <rect x="150" y="155" width="250" height="100" rx="3" class="box-fill"/>
  <text x="275" y="175" text-anchor="middle" class="text">Attention Layer (16 heads)</text>

  <rect x="165" y="190" width="55" height="50" rx="3" class="box-gpu0"/>
  <text x="192" y="212" text-anchor="middle" class="text-small">Heads</text>
  <text x="192" y="228" text-anchor="middle" class="text-small">0-3</text>

  <rect x="230" y="190" width="55" height="50" rx="3" class="box-gpu1"/>
  <text x="257" y="212" text-anchor="middle" class="text-small">Heads</text>
  <text x="257" y="228" text-anchor="middle" class="text-small">4-7</text>

  <rect x="295" y="190" width="55" height="50" rx="3" class="box-gpu2"/>
  <text x="322" y="212" text-anchor="middle" class="text-small">Heads</text>
  <text x="322" y="228" text-anchor="middle" class="text-small">8-11</text>

  <rect x="360" y="190" width="55" height="50" rx="3" class="box-gpu3"/>
  <text x="387" y="212" text-anchor="middle" class="text-small">Heads</text>
  <text x="387" y="228" text-anchor="middle" class="text-small">12-15</text>

  <!-- All-Reduce -->
  <line x1="420" y1="215" x2="450" y2="215" class="line"/>
  <polygon points="460,215 450,210 450,220" class="arrow"/>

  <rect x="460" y="185" width="100" height="60" rx="3" class="box-fill"/>
  <text x="510" y="210" text-anchor="middle" class="text-small">All-Reduce</text>
  <text x="510" y="228" text-anchor="middle" class="text-small">(NCCL)</text>

  <!-- Features list -->
  <rect x="150" y="270" width="440" height="40" rx="3" class="box-fill"/>
  <text x="180" y="292" class="text-small">Features: Activation Checkpointing | FP16 Mixed Precision | CPU Offload | Gradient Accumulation</text>
</svg>
