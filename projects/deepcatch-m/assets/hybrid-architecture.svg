<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" style="background:#fff">
  <style>
    .box-fill { fill: #fafafa; stroke: #e9e9e7; stroke-width: 1.5; }
    .text { font-family: 'Inter', -apple-system, sans-serif; fill: #37352f; font-size: 14px; font-weight: 500; }
    .text-title { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 15px; font-weight: 700; }
    .text-small { font-family: 'Inter', -apple-system, sans-serif; fill: #787774; font-size: 11px; font-weight: 400; }
    .line { stroke: #d3d1cb; stroke-width: 1.5; fill: none; }
    .arrow { fill: #a31f34; }
    .accent-line { stroke: #a31f34; stroke-width: 3; }
  </style>

  <!-- Training Layer -->
  <rect x="40" y="20" width="620" height="100" rx="12" class="box-fill"/>
  <line x1="40" y1="20" x2="40" y2="120" class="accent-line" stroke-linecap="round"/>
  <text x="70" y="48" class="text-title">Training Layer (Native GPU)</text>
  <text x="70" y="72" class="text-small">Direct CUDA access for maximum performance</text>
  <text x="70" y="90" class="text-small">Multi-GPU support via DataParallel</text>
  <text x="380" y="72" class="text-small">Mixed precision (FP16) for memory efficiency</text>
  <text x="380" y="90" class="text-small">Ray Tune for distributed hyperparameter search</text>

  <!-- Arrow -->
  <line x1="350" y1="120" x2="350" y2="150" class="line"/>
  <polygon points="350,158 344,148 356,148" class="arrow"/>

  <!-- Serving Layer -->
  <rect x="40" y="166" width="620" height="100" rx="12" class="box-fill"/>
  <line x1="40" y1="166" x2="40" y2="266" style="stroke:#35a854; stroke-width:3" stroke-linecap="round"/>
  <text x="70" y="194" class="text-title" style="fill:#35a854">Serving Layer (Docker-based)</text>
  <text x="70" y="218" class="text-small">Containerized for reproducibility and portability</text>
  <text x="70" y="236" class="text-small">FastAPI for high-performance REST endpoints</text>
  <text x="380" y="218" class="text-small">Health checks and monitoring integration</text>
  <text x="380" y="236" class="text-small">Isolated dependencies for production stability</text>
</svg>
