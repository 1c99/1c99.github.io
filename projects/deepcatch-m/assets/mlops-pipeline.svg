<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" style="background:#fff">
  <style>
    .box-fill { fill: #fafafa; stroke: #e9e9e7; stroke-width: 1.5; }
    .text { font-family: 'Inter', -apple-system, sans-serif; fill: #37352f; font-size: 15px; font-weight: 600; }
    .text-title { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 18px; font-weight: 700; }
    .text-small { font-family: 'Inter', -apple-system, sans-serif; fill: #787774; font-size: 11px; font-weight: 400; }
    .text-tool { font-family: 'Source Code Pro', monospace; fill: #a31f34; font-size: 12px; font-weight: 500; }
    .line { stroke: #d3d1cb; stroke-width: 1.5; fill: none; }
    .arrow { fill: #a31f34; }
  </style>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" class="text-title">MLOps Pipeline</text>
  <line x1="100" y1="42" x2="600" y2="42" class="line" stroke-dasharray="4,4"/>

  <!-- Four stages -->
  <rect x="50" y="62" width="130" height="64" rx="10" class="box-fill"/>
  <text x="115" y="88" text-anchor="middle" class="text">Data</text>
  <text x="115" y="110" text-anchor="middle" class="text-tool">DVC</text>

  <!-- Arrow -->
  <line x1="180" y1="94" x2="200" y2="94" class="line"/>
  <polygon points="208,94 198,88 198,100" class="arrow"/>

  <rect x="215" y="62" width="130" height="64" rx="10" class="box-fill"/>
  <text x="280" y="88" text-anchor="middle" class="text">Train</text>
  <text x="280" y="110" text-anchor="middle" class="text-tool">Multi-GPU</text>

  <!-- Arrow -->
  <line x1="345" y1="94" x2="365" y2="94" class="line"/>
  <polygon points="373,94 363,88 363,100" class="arrow"/>

  <rect x="380" y="62" width="130" height="64" rx="10" class="box-fill"/>
  <text x="445" y="88" text-anchor="middle" class="text">Track</text>
  <text x="445" y="110" text-anchor="middle" class="text-tool">MLflow</text>

  <!-- Arrow -->
  <line x1="510" y1="94" x2="530" y2="94" class="line"/>
  <polygon points="538,94 528,88 528,100" class="arrow"/>

  <rect x="545" y="62" width="130" height="64" rx="10" class="box-fill"/>
  <text x="610" y="88" text-anchor="middle" class="text">Deploy</text>
  <text x="610" y="110" text-anchor="middle" class="text-tool">Docker</text>

  <!-- Bottom label -->
  <text x="350" y="160" text-anchor="middle" class="text-small">Data Versioning → Training → Experiment Tracking → Containerized Serving</text>
</svg>
