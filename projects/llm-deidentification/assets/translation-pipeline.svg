<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 384" style="background:#fff">
  <defs>
    <style>
      .title{font-family:Inter,sans-serif;fill:#1a1a1a;font-size:19px;font-weight:700;text-anchor:middle;}
      .subtitle{font-family:Inter,sans-serif;fill:#666;font-size:12px;text-anchor:middle;}
      .nm{font-family:Inter,sans-serif;fill:#1a1a1a;font-size:13px;font-weight:700;text-anchor:middle;}
      .nma{font-family:Inter,sans-serif;fill:#a31f34;font-size:13px;font-weight:700;text-anchor:middle;}
      .sub{font-family:Inter,sans-serif;fill:#888;font-size:10px;text-anchor:middle;}
      .tag{font-family:Inter,sans-serif;fill:#a31f34;font-size:10px;font-weight:700;letter-spacing:.5px;text-anchor:middle;}
      .lbl{font-family:Inter,sans-serif;fill:#999;font-size:9.5px;text-anchor:middle;}
      .node{fill:#fafafa;stroke:#1a1a1a;stroke-width:1.2;}
      .nodeA{fill:#fff;stroke:#a31f34;stroke-width:2;}
      .nodeG{fill:#fff;stroke:#a31f34;stroke-width:1.4;stroke-dasharray:5 4;}
      .arr{stroke:#1a1a1a;stroke-width:1.5;fill:none;}
      .arrG{stroke:#a31f34;stroke-width:1.5;fill:none;}
      .arrL{stroke:#bbb;stroke-width:1.3;fill:none;stroke-dasharray:4 3;}
      .cap{font-family:Inter,sans-serif;fill:#666;font-size:11px;font-style:italic;text-anchor:middle;}
    </style>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/></marker>
    <marker id="ahG" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a31f34"/></marker>
    <marker id="ahL" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#bbb"/></marker>
  </defs>

  <text x="520" y="34" class="title">Multi-Agent Medical Translation</text>
  <text x="520" y="55" class="subtitle">Four role-specialized models — every translation reviewed, fixed, and signed off</text>

  <text x="520" y="108" class="tag">VERIFICATION LOOP</text>

  <!-- nodes -->
  <rect x="24" y="150" width="118" height="64" rx="10" class="node"/>
  <text x="83" y="178" class="nm">Input</text>
  <text x="83" y="195" class="sub">Medical text</text>

  <rect x="210" y="150" width="118" height="64" rx="9" class="node"/>
  <text x="269" y="178" class="nm">Translator</text>
  <text x="269" y="195" class="sub">draft</text>

  <rect x="388" y="150" width="118" height="64" rx="9" class="nodeA"/>
  <text x="447" y="178" class="nma">Reviewer</text>
  <text x="447" y="195" class="sub">accept? / issues</text>

  <rect x="566" y="150" width="118" height="64" rx="9" class="node"/>
  <text x="625" y="178" class="nm">Fixer</text>
  <text x="625" y="195" class="sub">apply fixes</text>

  <rect x="744" y="150" width="118" height="64" rx="9" class="node"/>
  <text x="803" y="178" class="nm">Supervisor</text>
  <text x="803" y="195" class="sub">choose best</text>

  <rect x="898" y="150" width="118" height="64" rx="10" class="node"/>
  <text x="957" y="178" class="nm">Output</text>
  <text x="957" y="195" class="sub">Translation</text>

  <!-- terminology gate -->
  <rect x="357" y="252" width="180" height="50" rx="10" class="nodeG"/>
  <text x="447" y="274" class="nma">Terminology gate</text>
  <text x="447" y="290" class="sub">independent of the LLM</text>

  <!-- forward arrows -->
  <path d="M142,182 H208" class="arr" marker-end="url(#ah)"/>
  <path d="M328,182 H386" class="arr" marker-end="url(#ah)"/>
  <path d="M506,182 H564" class="arr" marker-end="url(#ah)"/>
  <text x="535" y="174" class="lbl">reject</text>
  <path d="M684,182 H742" class="arr" marker-end="url(#ah)"/>
  <path d="M862,182 H896" class="arr" marker-end="url(#ah)"/>
  <text x="879" y="174" class="lbl">accept</text>

  <!-- gate into reviewer -->
  <path d="M447,250 V216" class="arrG" marker-end="url(#ahG)"/>

  <!-- feedback loop -->
  <path d="M803,214 V332 H269 V216" class="arrL" marker-end="url(#ahL)"/>
  <text x="536" y="348" class="lbl">loop until the reviewer + terminology gate accept</text>

  <text x="520" y="372" class="cap">An independent terminology check (not another LLM) guards clinical terms.</text>
</svg>
