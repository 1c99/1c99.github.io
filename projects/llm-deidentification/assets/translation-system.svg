<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" style="background:#fff">
  <style>
    .box-fill { fill: #fafafa; stroke: #e9e9e7; stroke-width: 1.5; }
    .box-accent { fill: #fdf2f2; stroke: #e9e9e7; stroke-width: 1.5; }
    .text { font-family: 'Inter', -apple-system, sans-serif; fill: #37352f; font-size: 14px; font-weight: 500; }
    .text-title { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 18px; font-weight: 700; }
    .text-small { font-family: 'Inter', -apple-system, sans-serif; fill: #787774; font-size: 11px; font-weight: 400; }
    .text-num { font-family: 'Inter', -apple-system, sans-serif; fill: #fff; font-size: 13px; font-weight: 700; }
    .line { stroke: #d3d1cb; stroke-width: 1.5; fill: none; }
    .arrow { fill: #a31f34; }
  </style>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" class="text-title">Translation System Architecture</text>
  <line x1="80" y1="42" x2="600" y2="42" class="line" stroke-dasharray="4,4"/>

  <!-- Three approaches -->
  <rect x="40" y="62" width="180" height="72" rx="10" class="box-fill"/>
  <circle cx="66" cy="86" r="14" fill="#a31f34"/>
  <text x="66" y="91" text-anchor="middle" class="text-num">1</text>
  <text x="148" y="86" text-anchor="middle" class="text">Ollama + Ray</text>
  <text x="148" y="106" text-anchor="middle" class="text-small">Distributed</text>

  <rect x="250" y="62" width="180" height="72" rx="10" class="box-fill"/>
  <circle cx="276" cy="86" r="14" fill="#a31f34"/>
  <text x="276" y="91" text-anchor="middle" class="text-num">2</text>
  <text x="358" y="86" text-anchor="middle" class="text">Multi-Agent</text>
  <text x="358" y="106" text-anchor="middle" class="text-small">Workflow</text>

  <rect x="460" y="62" width="180" height="72" rx="10" class="box-fill"/>
  <circle cx="486" cy="86" r="14" fill="#a31f34"/>
  <text x="486" y="91" text-anchor="middle" class="text-num">3</text>
  <text x="568" y="86" text-anchor="middle" class="text">M2M100</text>
  <text x="568" y="106" text-anchor="middle" class="text-small">+ Caching</text>

  <!-- Arrows down merging -->
  <line x1="130" y1="134" x2="130" y2="158" class="line"/>
  <line x1="340" y1="134" x2="340" y2="158" class="line"/>
  <line x1="550" y1="134" x2="550" y2="158" class="line"/>
  <line x1="130" y1="158" x2="550" y2="158" class="line"/>
  <line x1="340" y1="158" x2="340" y2="178" class="line"/>
  <polygon points="340,186 334,176 346,176" class="arrow"/>

  <!-- Input Processing -->
  <rect x="100" y="190" width="480" height="48" rx="10" class="box-fill"/>
  <text x="340" y="214" text-anchor="middle" class="text">Input Processing</text>
  <text x="340" y="232" text-anchor="middle" class="text-small">CSV / JSON with HTML tag preservation</text>

  <!-- Arrow down -->
  <line x1="340" y1="238" x2="340" y2="258" class="line"/>
  <polygon points="340,266 334,256 346,256" class="arrow"/>

  <!-- Output -->
  <rect x="160" y="270" width="360" height="24" rx="12" class="box-accent"/>
  <text x="340" y="287" text-anchor="middle" class="text" style="fill:#a31f34; font-weight:600">Translated Content (7+ languages)</text>
</svg>
