<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" style="background:#fff">
  <defs>
    <style>
      .title{font-family:Inter,sans-serif;fill:#1a1a1a;font-size:19px;font-weight:700;text-anchor:middle;}
      .subtitle{font-family:Inter,sans-serif;fill:#666;font-size:12px;text-anchor:middle;}
      .nm{font-family:Inter,sans-serif;fill:#1a1a1a;font-size:13px;font-weight:700;text-anchor:middle;}
      .nmg{font-family:Inter,sans-serif;fill:#2f8f4e;font-size:13px;font-weight:700;text-anchor:middle;}
      .nmr{font-family:Inter,sans-serif;fill:#a31f34;font-size:13px;font-weight:700;text-anchor:middle;}
      .sub{font-family:Inter,sans-serif;fill:#888;font-size:10px;text-anchor:middle;}
      .tag{font-family:Inter,sans-serif;fill:#a31f34;font-size:10px;font-weight:700;letter-spacing:.5px;text-anchor:middle;}
      .node{fill:#fafafa;stroke:#1a1a1a;stroke-width:1.2;}
      .nodeG{fill:#f0faf0;stroke:#2f8f4e;stroke-width:1.6;}
      .nodeR{fill:#fdf2f2;stroke:#a31f34;stroke-width:1.4;}
      .arr{stroke:#1a1a1a;stroke-width:1.5;fill:none;}
      .cap{font-family:Inter,sans-serif;fill:#666;font-size:11px;font-style:italic;text-anchor:middle;}
    </style>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/></marker>
  </defs>

  <text x="520" y="34" class="title">PHI De-identification Pipeline</text>
  <text x="520" y="55" class="subtitle">Two prongs — header metadata and burned-in pixels — stripped of PHI, then merged into one shareable result</text>

  <!-- Input -->
  <rect x="24" y="168" width="118" height="60" rx="10" class="node"/>
  <text x="83" y="194" class="nm">Medical Image</text>
  <text x="83" y="212" class="sub">DICOM</text>

  <!-- Output -->
  <rect x="898" y="168" width="118" height="60" rx="10" class="nodeG"/>
  <text x="957" y="192" class="nmg">De-identified</text>
  <text x="957" y="210" class="sub">HIPAA / GDPR-safe</text>

  <!-- lane tags -->
  <text x="275" y="88" class="tag">METADATA</text>
  <text x="290" y="242" class="tag">BURNED-IN PIXELS</text>

  <!-- top lane: metadata -->
  <rect x="200" y="96" width="150" height="58" rx="9" class="node"/>
  <text x="275" y="121" class="nm">DICOM Header</text>
  <text x="275" y="138" class="sub">structured fields</text>

  <rect x="430" y="96" width="150" height="58" rx="9" class="node"/>
  <text x="505" y="121" class="nm">LLM Analysis</text>
  <text x="505" y="138" class="sub">identify PHI fields</text>

  <rect x="660" y="96" width="150" height="58" rx="9" class="nodeG"/>
  <text x="735" y="121" class="nmg">Anonymize</text>
  <text x="735" y="138" class="sub">consistent mappings</text>

  <!-- bottom lane: pixels -->
  <rect x="200" y="250" width="150" height="58" rx="9" class="node"/>
  <text x="275" y="275" class="nm">Image Pixels</text>
  <text x="275" y="292" class="sub">burn-in text</text>

  <rect x="430" y="250" width="150" height="58" rx="9" class="node"/>
  <text x="505" y="275" class="nm">OCR + NER</text>
  <text x="505" y="292" class="sub">locate &amp; classify</text>

  <rect x="660" y="250" width="150" height="58" rx="9" class="nodeR"/>
  <text x="735" y="275" class="nmr">Mask PHI</text>
  <text x="735" y="292" class="sub">keep L/R, PA markers</text>

  <!-- arrows: input splits -->
  <path d="M142,188 H171 V125 H198" class="arr" marker-end="url(#ah)"/>
  <path d="M142,208 H171 V279 H198" class="arr" marker-end="url(#ah)"/>
  <!-- top lane forward -->
  <path d="M350,125 H428" class="arr" marker-end="url(#ah)"/>
  <path d="M580,125 H658" class="arr" marker-end="url(#ah)"/>
  <!-- bottom lane forward -->
  <path d="M350,279 H428" class="arr" marker-end="url(#ah)"/>
  <path d="M580,279 H658" class="arr" marker-end="url(#ah)"/>
  <!-- merge into output -->
  <path d="M810,125 H854 V198 H896" class="arr" marker-end="url(#ah)"/>
  <path d="M810,279 H854 V198 H896" class="arr" marker-end="url(#ah)"/>

  <text x="520" y="386" class="cap">Both prongs feed one PHI-free result — safe to share for research, with clinical markers (L/R, PA) preserved.</text>
</svg>
