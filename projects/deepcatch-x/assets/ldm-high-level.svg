<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" style="background:#fff">
  <style>
    .box-fill { fill: #fafafa; stroke: #e9e9e7; stroke-width: 1.5; rx: 10; }
    .box-accent { fill: #fdf2f2; stroke: #e9e9e7; stroke-width: 1.5; rx: 10; }
    .text { font-family: 'Inter', -apple-system, sans-serif; fill: #37352f; font-size: 14px; font-weight: 500; }
    .text-title { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 18px; font-weight: 700; }
    .text-small { font-family: 'Inter', -apple-system, sans-serif; fill: #787774; font-size: 11px; font-weight: 400; }
    .line { stroke: #d3d1cb; stroke-width: 1.5; fill: none; }
    .arrow { fill: #a31f34; }
  </style>

  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" class="text-title">LatentDiffusion3D</text>
  <line x1="100" y1="50" x2="600" y2="50" class="line" stroke-dasharray="4,4"/>

  <!-- Input -->
  <rect x="130" y="70" width="440" height="44" rx="10" class="box-accent"/>
  <text x="350" y="98" text-anchor="middle" class="text">Input: 2D Aorta Mask (512x512) from Stage 1</text>

  <!-- Arrow -->
  <line x1="350" y1="114" x2="350" y2="138" class="line"/>
  <polygon points="350,146 344,136 356,136" class="arrow"/>

  <!-- Projection2Dto3D -->
  <rect x="80" y="150" width="540" height="76" rx="10" class="box-fill"/>
  <text x="350" y="178" text-anchor="middle" class="text">Projection2Dto3D</text>
  <text x="350" y="198" text-anchor="middle" class="text-small">2D Conv (1 → 64 → 128)  ·  Flatten + Linear (128×16×16 → 256×4×4×4)  ·  3D Conv → latent_dim</text>

  <!-- Arrow -->
  <line x1="350" y1="226" x2="350" y2="250" class="line"/>
  <polygon points="350,258 344,248 356,248" class="arrow"/>

  <!-- Time Embedding -->
  <rect x="130" y="262" width="440" height="56" rx="10" class="box-fill"/>
  <text x="350" y="288" text-anchor="middle" class="text">Time Embedding</text>
  <text x="350" y="308" text-anchor="middle" class="text-small">Linear(1) → SiLU → Linear → latent_dim</text>

  <!-- Arrow -->
  <line x1="350" y1="318" x2="350" y2="342" class="line"/>
  <polygon points="350,350 344,340 356,340" class="arrow"/>

  <!-- UNet3DConditioned -->
  <rect x="80" y="354" width="540" height="76" rx="10" class="box-fill"/>
  <text x="350" y="382" text-anchor="middle" class="text">UNet3DConditioned (Denoiser)</text>
  <text x="350" y="402" text-anchor="middle" class="text-small">Encoder: Down blocks + skip  ·  Middle: Conv + SpatialTransformer3D  ·  Decoder: Up blocks + skip concat</text>

  <!-- Arrow with label -->
  <line x1="350" y1="430" x2="350" y2="454" class="line"/>
  <polygon points="350,462 344,452 356,452" class="arrow"/>
  <text x="420" y="448" class="text-small" style="font-style:italic">iterate T → 0</text>

  <!-- VAE3D Decoder -->
  <rect x="130" y="466" width="440" height="44" rx="10" class="box-accent"/>
  <text x="350" y="494" text-anchor="middle" class="text">VAE3D Decoder (frozen)  ·  Latent (8³) → 3D Volume (128³)</text>

  <!-- Arrow -->
  <line x1="350" y1="510" x2="350" y2="530" class="line"/>
  <polygon points="350,538 344,528 356,528" class="arrow"/>

  <!-- Output -->
  <text x="350" y="554" text-anchor="middle" class="text" style="font-weight:600; fill:#a31f34">Output: 3D Aorta Volume (128 × 128 × 128)</text>
</svg>
