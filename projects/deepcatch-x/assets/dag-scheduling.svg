<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" style="background:#fff">
  <style>
    .box-input { fill: #fdf2f2; stroke: #e9e9e7; stroke-width: 1.5; }
    .box-l0 { fill: #fafafa; stroke: #a31f34; stroke-width: 1.5; }
    .box-l1 { fill: #fafafa; stroke: #d4a574; stroke-width: 1.5; }
    .box-l2 { fill: #fafafa; stroke: #787774; stroke-width: 1.5; }
    .text { font-family: 'Inter', -apple-system, sans-serif; fill: #37352f; font-size: 13px; font-weight: 500; }
    .text-title { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 16px; font-weight: 700; }
    .text-small { font-family: 'Inter', -apple-system, sans-serif; fill: #787774; font-size: 10px; font-weight: 400; }
    .text-dep { font-family: 'Inter', -apple-system, sans-serif; fill: #9b9a97; font-size: 9px; font-weight: 400; }
    .text-label { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 11px; font-weight: 600; }
    .text-level { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; }
    .line { stroke: #d3d1cb; stroke-width: 1.5; fill: none; }
    .line-skip { stroke: #d3d1cb; stroke-width: 1.5; fill: none; stroke-dasharray: 5,3; }
    .arrow { fill: #a31f34; }
  </style>

  <!-- Title -->
  <text x="480" y="24" text-anchor="middle" class="text-title">Module Dependency DAG</text>

  <!-- Input DICOM Image -->
  <rect x="380" y="38" width="200" height="34" rx="8" class="box-input"/>
  <text x="480" y="60" text-anchor="middle" class="text">Input DICOM Image</text>

  <!-- Fan-out from Input to L0 -->
  <line x1="480" y1="72" x2="480" y2="84" class="line"/>
  <line x1="109" y1="84" x2="851" y2="84" class="line"/>
  <line x1="109" y1="84" x2="109" y2="100" class="line"/>
  <line x1="215" y1="84" x2="215" y2="100" class="line"/>
  <line x1="321" y1="84" x2="321" y2="100" class="line"/>
  <line x1="427" y1="84" x2="427" y2="100" class="line"/>
  <line x1="533" y1="84" x2="533" y2="100" class="line"/>
  <line x1="639" y1="84" x2="639" y2="100" class="line"/>
  <line x1="745" y1="84" x2="745" y2="100" class="line"/>
  <line x1="851" y1="84" x2="851" y2="100" class="line"/>
  <polygon points="109,108 103,98 115,98" class="arrow"/>
  <polygon points="215,108 209,98 221,98" class="arrow"/>
  <polygon points="321,108 315,98 327,98" class="arrow"/>
  <polygon points="427,108 421,98 433,98" class="arrow"/>
  <polygon points="533,108 527,98 539,98" class="arrow"/>
  <polygon points="639,108 633,98 645,98" class="arrow"/>
  <polygon points="745,108 739,98 751,98" class="arrow"/>
  <polygon points="851,108 845,98 857,98" class="arrow"/>

  <!-- L0 label -->
  <text x="18" y="132" class="text-level">L0</text>

  <!-- Level 0: 8 independent segmentation modules (GPU) -->
  <rect x="70" y="108" width="78" height="40" rx="8" class="box-l0"/>
  <text x="109" y="133" text-anchor="middle" class="text">Lung</text>

  <rect x="176" y="108" width="78" height="40" rx="8" class="box-l0"/>
  <text x="215" y="133" text-anchor="middle" class="text">Heart</text>

  <rect x="282" y="108" width="78" height="40" rx="8" class="box-l0"/>
  <text x="321" y="133" text-anchor="middle" class="text">Bone</text>

  <rect x="388" y="108" width="78" height="40" rx="8" class="box-l0"/>
  <text x="427" y="123" text-anchor="middle" class="text" style="font-size:11px">Bone</text>
  <text x="427" y="137" text-anchor="middle" class="text" style="font-size:11px">Supp</text>

  <rect x="494" y="108" width="78" height="40" rx="8" class="box-l0"/>
  <text x="533" y="133" text-anchor="middle" class="text">Airway</text>

  <rect x="600" y="108" width="78" height="40" rx="8" class="box-l0"/>
  <text x="639" y="133" text-anchor="middle" class="text">Aorta</text>

  <rect x="706" y="108" width="78" height="40" rx="8" class="box-l0"/>
  <text x="745" y="133" text-anchor="middle" class="text" style="font-size:11px">T12-L1</text>

  <rect x="812" y="108" width="78" height="40" rx="8" class="box-l0"/>
  <text x="851" y="133" text-anchor="middle" class="text">LAA</text>

  <!-- ─── L0 → L1 Arrows ─── -->

  <!-- Lung (109) fans to COVID (80), Vessel (160), TB (240) -->
  <line x1="109" y1="148" x2="109" y2="172" class="line"/>
  <line x1="80" y1="172" x2="240" y2="172" class="line"/>
  <line x1="80" y1="172" x2="80" y2="210" class="line"/>
  <line x1="160" y1="172" x2="160" y2="210" class="line"/>
  <line x1="240" y1="172" x2="240" y2="210" class="line"/>
  <polygon points="80,218 74,208 86,208" class="arrow"/>
  <polygon points="160,218 154,208 166,208" class="arrow"/>
  <polygon points="240,218 234,208 246,208" class="arrow"/>

  <!-- L1 label -->
  <text x="18" y="240" class="text-level">L1</text>

  <!-- Level 1: 3 detection modules (GPU, need lung mask) -->
  <rect x="47" y="218" width="66" height="36" rx="7" class="box-l1"/>
  <text x="80" y="241" text-anchor="middle" class="text" style="font-size:12px">COVID</text>

  <rect x="127" y="218" width="66" height="36" rx="7" class="box-l1"/>
  <text x="160" y="241" text-anchor="middle" class="text" style="font-size:12px">Vessel</text>

  <rect x="207" y="218" width="66" height="36" rx="7" class="box-l1"/>
  <text x="240" y="241" text-anchor="middle" class="text" style="font-size:12px">TB</text>

  <!-- Aorta (639) fans to Asc (599), Desc (679) -->
  <line x1="639" y1="148" x2="639" y2="172" class="line"/>
  <line x1="599" y1="172" x2="679" y2="172" class="line"/>
  <line x1="599" y1="172" x2="599" y2="210" class="line"/>
  <line x1="679" y1="172" x2="679" y2="210" class="line"/>
  <polygon points="599,218 593,208 605,208" class="arrow"/>
  <polygon points="679,218 673,208 685,208" class="arrow"/>

  <rect x="566" y="218" width="66" height="36" rx="7" class="box-l1"/>
  <text x="599" y="241" text-anchor="middle" class="text" style="font-size:12px">Asc</text>

  <rect x="646" y="218" width="66" height="36" rx="7" class="box-l1"/>
  <text x="679" y="241" text-anchor="middle" class="text" style="font-size:12px">Desc</text>

  <!-- Asc (599) + Desc (679) → Diameter (639) -->
  <line x1="599" y1="254" x2="599" y2="278" class="line"/>
  <line x1="679" y1="254" x2="679" y2="278" class="line"/>
  <line x1="599" y1="278" x2="679" y2="278" class="line"/>
  <line x1="639" y1="278" x2="639" y2="316" class="line"/>
  <polygon points="639,324 633,314 645,314" class="arrow"/>

  <!-- ─── L0 → L2 Skip Arrows (dashed, skip L1) ─── -->

  <!-- Lung → Peripheral: from Lung bottom, route left edge down to Peripheral -->
  <path d="M 90,148 L 90,156 L 36,156 L 36,345 L 56,345" class="line-skip"/>
  <polygon points="64,345 54,339 54,351" class="arrow"/>

  <!-- Lung + Heart → CTR: merge from both bottoms, route right of L1 down to CTR -->
  <path d="M 130,148 L 130,164 L 162,164" class="line-skip"/>
  <path d="M 200,148 L 200,164 L 162,164" class="line-skip"/>
  <path d="M 162,164 L 280,164 L 280,345 L 257,345" class="line-skip"/>
  <polygon points="257,345 267,339 267,351" class="arrow"/>


  <!-- L2 label -->
  <text x="18" y="348" class="text-level">L2</text>

  <!-- Level 2: 3 measurement modules (CPU, post-processing) -->
  <rect x="61" y="324" width="86" height="42" rx="7" class="box-l2"/>
  <text x="104" y="343" text-anchor="middle" class="text" style="font-size:12px">Peripheral</text>

  <rect x="171" y="324" width="86" height="42" rx="7" class="box-l2"/>
  <text x="214" y="343" text-anchor="middle" class="text" style="font-size:12px">CTR</text>

  <rect x="596" y="324" width="86" height="42" rx="7" class="box-l2"/>
  <text x="639" y="343" text-anchor="middle" class="text" style="font-size:12px">Diameter</text>

  <!-- ─── Legend ─── -->
  <line x1="50" y1="394" x2="910" y2="394" class="line" stroke-dasharray="4,4"/>
  <text x="50" y="416" class="text-label">Execution Levels</text>

  <rect x="50" y="428" width="12" height="12" rx="3" fill="#fafafa" stroke="#a31f34" stroke-width="1.5"/>
  <text x="70" y="439" class="text-small">Level 0: lung, heart, bone, bone_supp, airway, aorta, t12-l1, laa — Independent segmentation, GPU (8 modules)</text>

  <rect x="50" y="448" width="12" height="12" rx="3" fill="#fafafa" stroke="#d4a574" stroke-width="1.5"/>
  <text x="70" y="459" class="text-small">Level 1: covid, vessel, tb, asc, desc — Depend on L0 masks, GPU (5 modules)</text>

  <rect x="50" y="468" width="12" height="12" rx="3" fill="#fafafa" stroke="#787774" stroke-width="1.5"/>
  <text x="70" y="479" class="text-small">Level 2: peripheral, ctr, diameter — Post-processing measurement, CPU (3 modules)</text>
</svg>
