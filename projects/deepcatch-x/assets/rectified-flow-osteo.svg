<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" style="background:#fff">
  <defs>
    <style>
      .title       { font-family: Inter, sans-serif; fill: #1a1a1a; font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
      .lbl         { font-family: Inter, sans-serif; fill: #1a1a1a; font-size: 13.5px; font-weight: 600; }
      .lbl-light   { font-family: Inter, sans-serif; fill: #fff;    font-size: 14px; font-weight: 600; }
      .sub         { font-family: Inter, sans-serif; fill: #666;    font-size: 11px; font-weight: 400; }
      .sub-light   { font-family: Inter, sans-serif; fill: #bdbdbd; font-size: 11px; font-weight: 400; }
      .metric      { font-family: Inter, sans-serif; fill: #a31f34; font-size: 14px; font-weight: 700; }
      .caption     { font-family: Inter, sans-serif; fill: #666;    font-size: 12px; font-style: italic; text-anchor: middle; }
      .badge-prop  { fill: #fff; stroke: #b0b0b0; stroke-width: 1.2; }
      .badge-g     { font-family: Inter, sans-serif; fill: #707070; font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; }
      .box-input   { fill: #f6f6f6; stroke: #1a1a1a; stroke-width: 1.2; }
      .box-output  { fill: #fff;    stroke: #a31f34; stroke-width: 1.8; }
      .box-model   { fill: #1a1a1a; stroke: none; }
      .box-prop    { fill: #fff;    stroke: #9a9a9a; stroke-width: 1.3; stroke-dasharray: 5,3; }
      .arr         { stroke: #1a1a1a; stroke-width: 1.5; fill: none; }
      .arr-loop    { stroke: #888;    stroke-width: 1.2; fill: none; stroke-dasharray: 3,3; }
      .arrowhead   { fill: #1a1a1a; }
      .arrowhead-g { fill: #888; }
    </style>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" class="arrowhead"/>
    </marker>
    <marker id="ahg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" class="arrowhead-g"/>
    </marker>
  </defs>

  <!-- ─────────── HEADER ─────────── -->
  <text x="560" y="36" class="title" text-anchor="middle">Rectified-Flow Osteoporosis Screening</text>
  <rect x="960" y="20" rx="4" width="128" height="24" class="badge-prop"/>
  <text x="1024" y="36" class="badge-g" text-anchor="middle">IN DEVELOPMENT</text>

  <!-- ─────────── INPUT ─────────── -->
  <rect x="60" y="140" rx="8" width="170" height="90" class="box-input"/>
  <text x="145" y="180" class="lbl" text-anchor="middle">Chest X-ray</text>
  <text x="145" y="200" class="sub" text-anchor="middle">standard PA radiograph</text>

  <!-- arrow input -> model -->
  <line x1="230" y1="185" x2="300" y2="185" class="arr" marker-end="url(#ah)"/>
  <text x="265" y="172" class="sub" text-anchor="middle">condition</text>

  <!-- ─────────── MODEL ─────────── -->
  <rect x="300" y="118" rx="10" width="270" height="134" class="box-model"/>
  <text x="435" y="152" class="lbl-light" text-anchor="middle">Conditional Rectified Flow</text>
  <text x="435" y="176" class="sub-light" text-anchor="middle">x-prediction &#8226; velocity field</text>
  <text x="435" y="194" class="sub-light" text-anchor="middle">shifted SD3-style timestep sampling</text>
  <text x="435" y="212" class="sub-light" text-anchor="middle">&#8776;30 Euler steps at inference</text>
  <text x="435" y="236" class="sub-light" text-anchor="middle">training: flow matching + vertebral mean-HU error</text>

  <!-- arrows model -> joint outputs -->
  <line x1="570" y1="160" x2="650" y2="126" class="arr" marker-end="url(#ah)"/>
  <line x1="570" y1="210" x2="650" y2="244" class="arr" marker-end="url(#ah)"/>
  <text x="610" y="190" class="sub" text-anchor="middle">joint</text>
  <text x="610" y="204" class="sub" text-anchor="middle">prediction</text>

  <!-- ─────────── JOINT OUTPUTS ─────────── -->
  <rect x="650" y="88" rx="8" width="220" height="76" class="box-output"/>
  <text x="760" y="120" class="lbl" text-anchor="middle">T12&#8211;L2 Vertebral Masks</text>
  <text x="760" y="140" class="sub" text-anchor="middle">per-level segmentation</text>

  <rect x="650" y="208" rx="8" width="220" height="76" class="box-output"/>
  <text x="760" y="240" class="lbl" text-anchor="middle">CT Attenuation (HU)</text>
  <text x="760" y="260" class="sub" text-anchor="middle">per-vertebra mean HU</text>

  <!-- arrows outputs -> uncertainty -->
  <line x1="870" y1="126" x2="945" y2="160" class="arr" marker-end="url(#ah)"/>
  <line x1="870" y1="246" x2="945" y2="212" class="arr" marker-end="url(#ah)"/>

  <!-- ─────────── UNCERTAINTY ─────────── -->
  <rect x="945" y="140" rx="8" width="185" height="92" class="box-prop"/>
  <text x="1037" y="172" class="lbl" text-anchor="middle">Per-Patient</text>
  <text x="1037" y="190" class="lbl" text-anchor="middle">Uncertainty</text>
  <text x="1037" y="212" class="sub" text-anchor="middle">screening decision support</text>

  <!-- repeated-sampling loop -->
  <path d="M 1037 232 L 1037 296 L 435 296 L 435 252" class="arr-loop" marker-end="url(#ahg)"/>
  <text x="736" y="288" class="sub" text-anchor="middle">repeated sampling &#215;N &#8594; distribution over predictions</text>

  <!-- caption -->
  <text x="590" y="356" class="caption">Opportunistic osteoporosis screening &#8212; the generative extraction stack, evolved from DDPM to rectified flow,</text>
  <text x="590" y="374" class="caption">jointly predicting anatomy and quantitative CT values with sampling-based uncertainty.</text>
</svg>
