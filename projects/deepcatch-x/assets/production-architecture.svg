<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" style="background:#fff">
  <style>
    .box { fill: #fafafa; stroke: #e9e9e7; stroke-width: 1.5; }
    .box-accent { fill: #fdf2f2; stroke: #e9e9e7; stroke-width: 1.5; }
    .box-inner { fill: #fff; stroke: #d3d1cb; stroke-width: 1; }
    .text { font-family: 'Inter', -apple-system, sans-serif; fill: #37352f; font-size: 13px; font-weight: 500; }
    .text-title { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 16px; font-weight: 700; }
    .text-small { font-family: 'Inter', -apple-system, sans-serif; fill: #787774; font-size: 10px; font-weight: 400; }
    .text-code { font-family: 'Source Code Pro', monospace; fill: #37352f; font-size: 10px; font-weight: 500; }
    .text-white { font-family: 'Inter', -apple-system, sans-serif; fill: #fff; font-size: 10px; font-weight: 600; }
    .line { stroke: #d3d1cb; stroke-width: 1.5; fill: none; }
    .line-flow { stroke: #a31f34; stroke-width: 1.5; fill: none; }
    .arrow { fill: #a31f34; }
    .badge { fill: #a31f34; }
  </style>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" class="text-title">Large-Scale Processing — Infrastructure Layer</text>
  <line x1="60" y1="36" x2="700" y2="36" class="line" stroke-dasharray="4,4"/>

  <!-- ═══ Layer 1: AdaptiveScheduler ═══ -->
  <rect x="60" y="48" width="640" height="106" rx="10" class="box-accent"/>
  <rect x="72" y="52" width="126" height="18" rx="4" class="badge"/>
  <text x="135" y="65" text-anchor="middle" class="text-white">AdaptiveScheduler</text>

  <rect x="80" y="76" width="185" height="44" rx="6" class="box-inner"/>
  <text x="172" y="94" text-anchor="middle" class="text" style="font-size:11px">Dependency Graph</text>
  <text x="172" y="108" text-anchor="middle" class="text-small">topological sort → levels</text>

  <rect x="287" y="76" width="185" height="44" rx="6" class="box-inner"/>
  <text x="380" y="94" text-anchor="middle" class="text" style="font-size:11px">Performance Profiler</text>
  <text x="380" y="108" text-anchor="middle" class="text-small">runtime estimation per module</text>

  <rect x="494" y="76" width="185" height="44" rx="6" class="box-inner"/>
  <text x="587" y="94" text-anchor="middle" class="text" style="font-size:11px">Resource Manager</text>
  <text x="587" y="108" text-anchor="middle" class="text-small">fractional GPU allocation</text>

  <text x="380" y="144" text-anchor="middle" class="text-small" style="font-weight:500">Module Affinity: greedy longest-first assignment across workers</text>

  <!-- Arrow 1→2 -->
  <line x1="380" y1="154" x2="380" y2="170" class="line-flow"/>
  <polygon points="380,178 374,168 386,168" class="arrow"/>

  <!-- ═══ Layer 2: SharedWeightsManager ═══ -->
  <rect x="60" y="178" width="640" height="96" rx="10" class="box-accent"/>
  <rect x="72" y="182" width="152" height="18" rx="4" class="badge"/>
  <text x="148" y="195" text-anchor="middle" class="text-white">SharedWeightsManager</text>

  <rect x="80" y="206" width="295" height="38" rx="6" class="box-inner"/>
  <text x="227" y="222" text-anchor="middle" class="text" style="font-size:11px; font-weight:600">EAGER</text>
  <text x="227" y="236" text-anchor="middle" class="text-small">≤4 modules → pre-load all checkpoints</text>

  <rect x="395" y="206" width="285" height="38" rx="6" class="box-inner"/>
  <text x="537" y="222" text-anchor="middle" class="text" style="font-size:11px; font-weight:600">LEVEL_BASED</text>
  <text x="537" y="236" text-anchor="middle" class="text-small">>4 modules → load per level, evict after</text>

  <text x="380" y="264" text-anchor="middle" class="text-small" style="font-weight:500">→ Ray Object Store (zero-copy broadcast to all workers)</text>

  <!-- Arrow 2→3 -->
  <line x1="380" y1="274" x2="380" y2="290" class="line-flow"/>
  <polygon points="380,298 374,288 386,288" class="arrow"/>

  <!-- ═══ Layer 3: Worker Lifecycle ═══ -->
  <rect x="60" y="298" width="640" height="96" rx="10" class="box-accent"/>
  <rect x="72" y="302" width="118" height="18" rx="4" class="badge"/>
  <text x="131" y="315" text-anchor="middle" class="text-white">Worker Lifecycle</text>

  <rect x="80" y="326" width="295" height="38" rx="6" class="box-inner"/>
  <text x="227" y="342" text-anchor="middle" class="text" style="font-size:11px">RSS Monitor (/proc/statm)</text>
  <text x="227" y="356" text-anchor="middle" class="text-small">GPU: 3 GB limit · CPU: 6 GB limit → kill + respawn</text>

  <rect x="395" y="326" width="285" height="38" rx="6" class="box-inner"/>
  <text x="537" y="342" text-anchor="middle" class="text" style="font-size:11px">Straggler Detection</text>
  <text x="537" y="356" text-anchor="middle" class="text-small">>3× median → gc.collect() + malloc_trim(0)</text>

  <text x="380" y="384" text-anchor="middle" class="text-small" style="font-weight:500">Automatic garbage collection and memory trim per batch cycle</text>

  <!-- Arrow 3→4 -->
  <line x1="380" y1="394" x2="380" y2="410" class="line-flow"/>
  <polygon points="380,418 374,408 386,408" class="arrow"/>

  <!-- ═══ Layer 4: Data Integrity ═══ -->
  <rect x="60" y="418" width="640" height="96" rx="10" class="box-accent"/>
  <rect x="72" y="422" width="100" height="18" rx="4" class="badge"/>
  <text x="122" y="435" text-anchor="middle" class="text-white">Data Integrity</text>

  <rect x="80" y="446" width="195" height="38" rx="6" class="box-inner"/>
  <text x="177" y="462" text-anchor="middle" class="text" style="font-size:11px">StateDB (SQLite)</text>
  <text x="177" y="476" text-anchor="middle" class="text-small">resume support · failed CSV log</text>

  <rect x="293" y="446" width="190" height="38" rx="6" class="box-inner"/>
  <text x="388" y="462" text-anchor="middle" class="text" style="font-size:11px">Atomic Writes</text>
  <text x="388" y="476" text-anchor="middle" class="text-small">rename() · batch dirs (100K each)</text>

  <rect x="501" y="446" width="180" height="38" rx="6" class="box-inner"/>
  <text x="591" y="462" text-anchor="middle" class="text" style="font-size:11px">Backpressure</text>
  <text x="591" y="476" text-anchor="middle" class="text-small">2× inflight limit · queue depth</text>

  <text x="380" y="504" text-anchor="middle" class="text-small" style="font-weight:500">Reliable processing of 2.3M+ files across multi-day runs</text>
</svg>
