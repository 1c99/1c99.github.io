<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 455" style="background:#fff">
  <style>
    .box { fill: #fafafa; stroke: #e9e9e7; stroke-width: 1.5; }
    .box-accent { fill: #fdf2f2; stroke: #e9e9e7; stroke-width: 1.5; }
    .text { font-family: 'Inter', -apple-system, sans-serif; fill: #37352f; font-size: 13px; font-weight: 500; }
    .text-title { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 16px; font-weight: 700; }
    .text-small { font-family: 'Inter', -apple-system, sans-serif; fill: #787774; font-size: 10px; font-weight: 400; }
    .text-label { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 11px; font-weight: 600; }
    .text-white { font-family: 'Inter', -apple-system, sans-serif; fill: #fff; font-size: 9px; font-weight: 600; }
    .text-code { font-family: 'Source Code Pro', monospace; fill: #37352f; font-size: 10px; font-weight: 500; }
    .line { stroke: #d3d1cb; stroke-width: 1.5; fill: none; }
    .line-flow { stroke: #a31f34; stroke-width: 1.5; fill: none; }
    .arrow { fill: #a31f34; }
    .arrow-gray { fill: #d3d1cb; }
  </style>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" class="text-title">Split-Pool Pipeline — Aorta + Diameter</text>
  <line x1="60" y1="36" x2="700" y2="36" class="line" stroke-dasharray="4,4"/>

  <!-- Input: all DICOM files -->
  <rect x="260" y="48" width="240" height="34" rx="8" class="box-accent"/>
  <text x="380" y="70" text-anchor="middle" class="text">All DICOM files</text>

  <!-- Arrow down to mini-batch split -->
  <line x1="380" y1="82" x2="380" y2="96" class="line"/>
  <line x1="130" y1="96" x2="630" y2="96" class="line"/>
  <line x1="130" y1="96" x2="130" y2="110" class="line"/>
  <line x1="380" y1="96" x2="380" y2="110" class="line"/>
  <line x1="630" y1="96" x2="630" y2="110" class="line"/>
  <polygon points="130,118 124,108 136,108" class="arrow-gray"/>
  <polygon points="380,118 374,108 386,108" class="arrow-gray"/>
  <polygon points="630,118 624,108 636,108" class="arrow-gray"/>

  <!-- Mini-batches -->
  <rect x="80" y="118" width="100" height="28" rx="5" fill="#fff" stroke="#e9e9e7" stroke-width="1"/>
  <text x="130" y="137" text-anchor="middle" class="text-code">batch 1</text>

  <rect x="330" y="118" width="100" height="28" rx="5" fill="#fff" stroke="#e9e9e7" stroke-width="1"/>
  <text x="380" y="137" text-anchor="middle" class="text-code">batch 2</text>

  <text x="505" y="137" font-family="Inter, sans-serif" fill="#b4b4b0" font-size="18px" font-weight="600">···</text>

  <rect x="580" y="118" width="100" height="28" rx="5" fill="#fff" stroke="#e9e9e7" stroke-width="1"/>
  <text x="630" y="137" text-anchor="middle" class="text-code">batch N</text>

  <text x="380" y="162" text-anchor="middle" class="text-small">Files split into mini-batches (batch_size = k) · backpressure-controlled</text>

  <!-- Divider -->
  <line x1="60" y1="176" x2="700" y2="176" class="line" stroke-dasharray="4,4"/>

  <!-- GPU Pool -->
  <text x="60" y="198" class="text-label">Stage 1: GPU Pool (M workers)</text>
  <text x="340" y="198" class="text-small">aorta segmentation · ~1s/file</text>

  <rect x="60" y="208" width="640" height="72" rx="10" fill="#fdf2f2" stroke="#e9e9e7" stroke-width="1.5"/>

  <!-- GPU Workers -->
  <rect x="80" y="220" width="130" height="48" rx="6" class="box"/>
  <text x="145" y="238" text-anchor="middle" class="text" style="font-size:12px">GPU Worker 0</text>
  <rect x="92" y="246" width="106" height="14" rx="3" fill="#a31f34"/>
  <text x="145" y="257" text-anchor="middle" class="text-white" style="font-size:8px">aorta (VRAM cached)</text>

  <text x="245" y="248" font-family="Inter, sans-serif" fill="#b4b4b0" font-size="16px" font-weight="600">···</text>

  <rect x="280" y="220" width="130" height="48" rx="6" class="box"/>
  <text x="345" y="238" text-anchor="middle" class="text" style="font-size:12px">GPU Worker 1</text>
  <rect x="292" y="246" width="106" height="14" rx="3" fill="#a31f34"/>
  <text x="345" y="257" text-anchor="middle" class="text-white" style="font-size:8px">aorta (VRAM cached)</text>

  <text x="445" y="248" font-family="Inter, sans-serif" fill="#b4b4b0" font-size="16px" font-weight="600">···</text>

  <rect x="480" y="220" width="130" height="48" rx="6" class="box"/>
  <text x="545" y="238" text-anchor="middle" class="text" style="font-size:12px">GPU Worker M</text>
  <rect x="492" y="246" width="106" height="14" rx="3" fill="#a31f34"/>
  <text x="545" y="257" text-anchor="middle" class="text-white" style="font-size:8px">aorta (VRAM cached)</text>

  <!-- Key benefit -->
  <rect x="624" y="222" width="72" height="46" rx="4" fill="#f0faf0" stroke="#c3e6c3" stroke-width="1"/>
  <text x="660" y="240" text-anchor="middle" class="text-small" style="font-weight:600; fill:#35a854">GPU</text>
  <text x="660" y="252" text-anchor="middle" class="text-small" style="font-weight:600; fill:#35a854">never</text>
  <text x="660" y="264" text-anchor="middle" class="text-small" style="font-weight:600; fill:#35a854">waits</text>

  <!-- Arrow: masks flow down -->
  <line x1="240" y1="280" x2="240" y2="304" class="line-flow"/>
  <polygon points="240,312 234,302 246,302" class="arrow"/>
  <line x1="440" y1="280" x2="440" y2="304" class="line-flow"/>
  <polygon points="440,312 434,302 446,302" class="arrow"/>

  <!-- CPU Pool -->
  <text x="60" y="328" class="text-label">Stage 2: CPU Pool (K workers)</text>
  <text x="340" y="328" class="text-small">diameter measurement · 5-120s/file</text>

  <rect x="60" y="338" width="640" height="56" rx="10" fill="#f0f4fa" stroke="#c3d4e6" stroke-width="1.5"/>

  <!-- CPU Workers -->
  <rect x="80" y="348" width="130" height="36" rx="6" class="box"/>
  <text x="145" y="364" text-anchor="middle" class="text" style="font-size:12px">CPU Worker 0</text>
  <text x="145" y="378" text-anchor="middle" class="text-small">diameter + cleanup</text>

  <text x="245" y="370" font-family="Inter, sans-serif" fill="#b4b4b0" font-size="16px" font-weight="600">···</text>

  <rect x="280" y="348" width="130" height="36" rx="6" class="box"/>
  <text x="345" y="364" text-anchor="middle" class="text" style="font-size:12px">CPU Worker 1</text>
  <text x="345" y="378" text-anchor="middle" class="text-small">diameter + cleanup</text>

  <text x="445" y="370" font-family="Inter, sans-serif" fill="#b4b4b0" font-size="16px" font-weight="600">···</text>

  <rect x="480" y="348" width="130" height="36" rx="6" class="box"/>
  <text x="545" y="364" text-anchor="middle" class="text" style="font-size:12px">CPU Worker K</text>
  <text x="545" y="378" text-anchor="middle" class="text-small">diameter + cleanup</text>

  <!-- Output -->
  <line x1="380" y1="394" x2="380" y2="412" class="line"/>
  <polygon points="380,420 374,410 386,410" class="arrow-gray"/>

  <rect x="200" y="420" width="360" height="20" rx="4" class="box"/>
  <text x="380" y="435" text-anchor="middle" class="text-small">Results: asc/desc diameter (mm) · batch subdirectories (100k files each)</text>
</svg>
