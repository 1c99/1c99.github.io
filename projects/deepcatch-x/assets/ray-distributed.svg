<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" style="background:#fff">
  <style>
    .box { fill: #fafafa; stroke: #e9e9e7; stroke-width: 1.5; }
    .box-accent { fill: #fdf2f2; stroke: #e9e9e7; stroke-width: 1.5; }
    .text { font-family: 'Inter', -apple-system, sans-serif; fill: #37352f; font-size: 13px; font-weight: 500; }
    .text-title { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 16px; font-weight: 700; }
    .text-small { font-family: 'Inter', -apple-system, sans-serif; fill: #787774; font-size: 10px; font-weight: 400; }
    .text-label { font-family: 'Inter', -apple-system, sans-serif; fill: #a31f34; font-size: 11px; font-weight: 600; }
    .text-white { font-family: 'Inter', -apple-system, sans-serif; fill: #fff; font-size: 9px; font-weight: 600; }
    .text-code { font-family: 'Source Code Pro', monospace; fill: #37352f; font-size: 10px; font-weight: 500; }
    .line { stroke: #d3d1cb; stroke-width: 1.5; fill: none; }
    .line-flow { stroke: #a31f34; stroke-width: 1.5; fill: none; }
    .arrow { fill: #a31f34; }
    .arrow-gray { fill: #d3d1cb; }
  </style>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" class="text-title">Batch Mode — Module Affinity, All Files</text>
  <line x1="60" y1="36" x2="700" y2="36" class="line" stroke-dasharray="4,4"/>

  <!-- Ray Head Node -->
  <rect x="200" y="48" width="360" height="50" rx="10" class="box-accent"/>
  <text x="380" y="70" text-anchor="middle" class="text">Ray Head Node</text>
  <text x="380" y="86" text-anchor="middle" class="text-small">AdaptiveScheduler · Fractional GPU (M/N per worker) · RSS-based restart</text>

  <!-- Fan-out to workers -->
  <line x1="380" y1="98" x2="380" y2="112" class="line"/>
  <line x1="120" y1="112" x2="640" y2="112" class="line"/>
  <line x1="120" y1="112" x2="120" y2="126" class="line"/>
  <line x1="380" y1="112" x2="380" y2="126" class="line"/>
  <line x1="640" y1="112" x2="640" y2="126" class="line"/>
  <polygon points="120,134 114,124 126,124" class="arrow-gray"/>
  <polygon points="380,134 374,124 386,124" class="arrow-gray"/>
  <polygon points="640,134 634,124 646,124" class="arrow-gray"/>

  <!-- Worker 0 -->
  <rect x="40" y="134" width="160" height="86" rx="8" class="box"/>
  <text x="120" y="154" text-anchor="middle" class="text">Worker 0</text>
  <rect x="56" y="162" width="128" height="18" rx="4" fill="#a31f34"/>
  <text x="120" y="175" text-anchor="middle" class="text-white" style="font-size:8px">lung · heart · bone</text>
  <text x="120" y="196" text-anchor="middle" class="text-code">File₁ File₂ ... Fileₙ</text>
  <text x="120" y="212" text-anchor="middle" class="text-small">all files, batch_size = N</text>

  <text x="250" y="178" font-family="Inter, sans-serif" fill="#b4b4b0" font-size="18px" font-weight="600">···</text>

  <!-- Worker 1 -->
  <rect x="300" y="134" width="160" height="86" rx="8" class="box"/>
  <text x="380" y="154" text-anchor="middle" class="text">Worker 1</text>
  <rect x="316" y="162" width="128" height="18" rx="4" fill="#a31f34"/>
  <text x="380" y="175" text-anchor="middle" class="text-white" style="font-size:8px">bone_supp · airway</text>
  <text x="380" y="196" text-anchor="middle" class="text-code">File₁ File₂ ... Fileₙ</text>
  <text x="380" y="212" text-anchor="middle" class="text-small">all files, batch_size = N</text>

  <text x="510" y="178" font-family="Inter, sans-serif" fill="#b4b4b0" font-size="18px" font-weight="600">···</text>

  <!-- Worker N -->
  <rect x="560" y="134" width="160" height="86" rx="8" class="box"/>
  <text x="640" y="154" text-anchor="middle" class="text">Worker N</text>
  <rect x="576" y="162" width="128" height="18" rx="4" fill="#a31f34"/>
  <text x="640" y="175" text-anchor="middle" class="text-white" style="font-size:8px">aorta · t12l1 · laa</text>
  <text x="640" y="196" text-anchor="middle" class="text-code">File₁ File₂ ... Fileₙ</text>
  <text x="640" y="212" text-anchor="middle" class="text-small">all files, batch_size = N</text>

  <text x="380" y="242" text-anchor="middle" class="text-small">Module affinity: greedy longest-first → 2-3 models per worker, all cached in VRAM</text>

  <!-- 3-Phase Flow -->
  <line x1="60" y1="256" x2="700" y2="256" class="line" stroke-dasharray="4,4"/>
  <text x="380" y="276" text-anchor="middle" class="text-label">3-Phase Scheduling</text>

  <!-- Phase 1 -->
  <rect x="60" y="290" width="200" height="56" rx="8" class="box"/>
  <text x="160" y="310" text-anchor="middle" class="text" style="font-size:12px">Phase 1: Independent</text>
  <text x="160" y="326" text-anchor="middle" class="text-small">8 modules in parallel (GPU)</text>
  <text x="160" y="340" text-anchor="middle" class="text-code">lung heart bone bone_supp ...</text>

  <!-- Arrow -->
  <line x1="260" y1="318" x2="284" y2="318" class="line-flow"/>
  <polygon points="294,318 284,312 284,324" class="arrow"/>

  <!-- Phase 2 -->
  <rect x="296" y="290" width="168" height="56" rx="8" class="box"/>
  <text x="380" y="310" text-anchor="middle" class="text" style="font-size:12px">Phase 2: Dependent</text>
  <text x="380" y="326" text-anchor="middle" class="text-small">3 modules (GPU, wait for lung)</text>
  <text x="380" y="340" text-anchor="middle" class="text-code">covid vessel tb</text>

  <!-- Arrow -->
  <line x1="464" y1="318" x2="500" y2="318" class="line-flow"/>
  <polygon points="510,318 500,312 500,324" class="arrow"/>

  <!-- Phase 3 -->
  <rect x="512" y="290" width="188" height="56" rx="8" class="box"/>
  <text x="606" y="310" text-anchor="middle" class="text" style="font-size:12px">Phase 3: Post-processing</text>
  <text x="606" y="326" text-anchor="middle" class="text-small">3 modules (CPU)</text>
  <text x="606" y="340" text-anchor="middle" class="text-code">ctr peripheral diameter</text>

  <!-- Sync barrier annotation -->
  <text x="278" y="362" text-anchor="middle" class="text-small" style="fill:#a31f34">sync: lung done</text>

  <!-- Shared Storage -->
  <rect x="180" y="390" width="400" height="30" rx="6" class="box"/>
  <text x="380" y="410" text-anchor="middle" class="text-small">Shared File System: DICOM inputs · segmentation masks · measurements</text>
</svg>
